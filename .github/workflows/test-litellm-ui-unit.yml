name: UI Unit Tests
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
  push:
    branches:
      - litellm_internal_staging

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui/litellm-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run UI unit tests (Vitest)
        env:
          CI: "true"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- package.json package-lock.json vitest.config.ts; then
            echo "Pull request: running only tests related to changes since $BASE_SHA"
            npm run test -- --run --changed "$BASE_SHA" --passWithNoTests \
              --pool forks --maxWorkers=3
          else
            echo "Push to $GITHUB_REF_NAME: running the full suite"
            npm run test -- --run --pool forks --maxWorkers=3
          fi

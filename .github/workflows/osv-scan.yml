name: OSV Scan

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=uv.lock
        --lockfile=ui/litellm-dashboard/package-lock.json
      fail-on-vuln: true
      upload-sarif: true

  osv-scan:
    if: github.event_name != 'pull_request'
    name: osv-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download osv-scanner v2.7.0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: Scan lockfiles
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source \
            --config osv-scanner.toml \
            -L uv.lock \
            -L ui/litellm-dashboard/package-lock.json
